# Windows only for now. macOS builds are pointless without an Apple Developer
# certificate (Gatekeeper refuses to open unsigned apps on recent macOS), and
# Linux is untested — the mac/linux jobs below are ready to switch on once
# there's a certificate to sign with.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the GitHub Release the updater reads

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Typecheck, compile, regenerate the icon and the licence manifest.
      # electron-builder only packages what this produces.
      - run: npm run prepackage

      # Create the release up front so electron-builder uploads into an
      # existing one. Left to itself it races while publishing several
      # artifacts and can create two release records for the same tag — one of
      # which GitHub then serves as "latest" with the installers missing,
      # breaking both the download page and the updater.
      - name: Ensure the release exists
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" || gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On a tag, publish straight to the GitHub Release so installed copies
      # see the update. Otherwise just build the artifacts.
      - name: Build and publish
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing happens only if these secrets exist; without them the build
          # still succeeds and produces unsigned artifacts.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: casement-windows
          path: release/*.exe
          if-no-files-found: error
