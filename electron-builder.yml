appId: com.casement.browser
productName: Casement
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

# Only the compiled output ships. Production dependencies are added by
# electron-builder automatically — `ws` in particular must stay a real module in
# node_modules rather than being bundled, or its native/JS selection breaks.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# Attribution manifest, read by the in-app licences screen.
extraResources:
  - from: build/licenses.json
    to: licenses.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Signing is opt-in: set WIN_CSC_LINK (path/URL to a .pfx) and
  # WIN_CSC_KEY_PASSWORD in the environment. Unset, the build is unsigned and
  # SmartScreen will warn users on first run.

# Both Windows targets emit .exe, so each needs its own name or the second
# build silently overwrites the first.
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Casement

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation needs an Apple Developer account: set APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, then flip this to true.
  notarize: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  synopsis: A Chromium workspace where panels, not tabs, are first-class
  desktop:
    entry:
      Name: Casement
      Categories: Network;WebBrowser;

# Updates are served from GitHub Releases — free for a public repo, and the
# only piece needed for users to receive Chromium security fixes. Set `owner`
# to your GitHub account; publishing a release with the built artifacts is
# what makes an update visible to installed copies.
publish:
  provider: github
  owner: vonbibrashow
  repo: casement
  releaseType: release
